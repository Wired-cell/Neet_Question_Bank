name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          .github/workflows
          app
          build.gradle.kts
          gradle.properties
          settings.gradle.kts

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 10406996
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Build APK
      run: gradle assembleDebug --no-daemon --stacktrace --info

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app-debug-${{ github.sha }}.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app-debug-${{ github.sha }}.apk
        retention-days: 30

