name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.3
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: android-34
        sdk-build-tools: 34.0.0
        sdk-platform-tools: true
        sdk-cmdline-tools: 10406996
        accept-licenses: true
    
    - name: Build APK
      run: gradle assembleDebug --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app-debug-${{ github.sha }}.apk
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app-debug-${{ github.sha }}.apk
        retention-days: 30
    
    - name: Create Release (on push to main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        name: Release v1.0.0
        tag_name: v1.0.0
        files: app-debug-${{ github.sha }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
