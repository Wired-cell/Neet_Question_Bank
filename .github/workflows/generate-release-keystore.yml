name: Generate Android Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate password-protected keystore
        env:
          KEYSTORE_SETUP_PASSWORD: ${{ secrets.KEYSTORE_SETUP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_SETUP_PASSWORD:-}" ]; then
            echo "::error::Add the KEYSTORE_SETUP_PASSWORD repository secret before running this workflow."
            exit 1
          fi

          mkdir -p keystore-output
          keytool -genkeypair -v \
            -keystore keystore-output/neet-release.p12 \
            -storetype PKCS12 \
            -alias neet-release \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Neet Question Bank" \
            -storepass:env KEYSTORE_SETUP_PASSWORD \
            -keypass:env KEYSTORE_SETUP_PASSWORD

          keytool -list \
            -keystore keystore-output/neet-release.p12 \
            -storetype PKCS12 \
            -alias neet-release \
            -storepass:env KEYSTORE_SETUP_PASSWORD

          base64 -w 0 keystore-output/neet-release.p12 > keystore-output/ANDROID_KEYSTORE_BASE64.txt
          cat > keystore-output/README.txt <<'EOF'
          Android release signing keystore
          Alias: neet-release
          Store password: the value you entered as the GitHub Actions secret KEYSTORE_SETUP_PASSWORD
          Key password: same as store password
          Permanent GitHub Actions secrets to create:
            ANDROID_KEYSTORE_BASE64 = contents of ANDROID_KEYSTORE_BASE64.txt
            ANDROID_KEYSTORE_PASSWORD = your KEYSTORE_SETUP_PASSWORD value
            ANDROID_KEY_ALIAS = neet-release
            ANDROID_KEY_PASSWORD = same password
          Keep neet-release.p12 backed up securely. Do not commit it to the repository.
          EOF

      - name: Upload keystore package (expires after 1 day)
        uses: actions/upload-artifact@v6
        with:
          name: android-release-keystore
          path: keystore-output/
          retention-days: 1
