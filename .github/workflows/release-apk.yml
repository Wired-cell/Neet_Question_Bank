name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            app
            build.gradle.kts
            gradle.properties
            settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 10406996
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app-debug-${{ github.ref_name }}.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app-release-unsigned-${{ github.ref_name }}.apk

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app-debug-${{ github.ref_name }}.apk
            app-release-unsigned-${{ github.ref_name }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            app-debug-${{ github.ref_name }}.apk
            app-release-unsigned-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
