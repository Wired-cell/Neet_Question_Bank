name: Build and Release ARM64 APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
permissions:
  contents: write
concurrency:
  group: android-arm64-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            app
            build.gradle.kts
            gradle.properties
            settings.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 10406996
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build ARM64 APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK ABI
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || { echo "ARM64 native libraries were not packaged"; exit 1; }
          OTHER_ABIS=$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" {print $2}' | sort -u | grep -v '^arm64-v8a$' || true)
          if [ -n "$OTHER_ABIS" ]; then echo "Unexpected ABIs found: $OTHER_ABIS"; exit 1; fi
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk app-release-arm64-${{ github.ref_name }}.apk
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: app-release-arm64-${{ github.ref_name }}.apk
          retention-days: 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: app-release-arm64-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
