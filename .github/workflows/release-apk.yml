name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Install Android SDK
      run: |
        # Install command-line tools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        curl -sS -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/latest
        rm cmdline-tools.zip
        
        # Accept all licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
        
        # Install required packages
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
        
        # Verify installation
        echo "SDK installed at: $ANDROID_HOME"
        ls -la $ANDROID_HOME/platforms/android-34/
        ls -la $ANDROID_HOME/build-tools/34.0.0/
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Rename APKs
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app-debug-${{ github.ref_name }}.apk
        mv app/build/outputs/apk/release/app-release.apk app-release-${{ github.ref_name }}.apk
    
    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: |
          app-debug-${{ github.ref_name }}.apk
          app-release-${{ github.ref_name }}.apk
        retention-days: 30
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          app-debug-${{ github.ref_name }}.apk
          app-release-${{ github.ref_name }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
