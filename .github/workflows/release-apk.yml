name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Set up Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.3
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-platform: android-34
        sdk-build-tools: 34.0.0
        sdk-platform-tools: true
        accept-licenses: true
    
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Rename APKs
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app-debug-${{ github.ref_name }}.apk
        mv app/build/outputs/apk/release/app-release.apk app-release-${{ github.ref_name }}.apk
    
    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: |
          app-debug-${{ github.ref_name }}.apk
          app-release-${{ github.ref_name }}.apk
        retention-days: 30
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          app-debug-${{ github.ref_name }}.apk
          app-release-${{ github.ref_name }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
